<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Humble & Blessed</title>
<meta name="description" content="Humble &amp; Blessed pieces are made in small runs in New York, with the praying cherub on everything.">
<!--seo-->
<link rel="canonical" href="https://evaldez12.github.io/humble-and-blessed-site/b/product.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Humble &amp; Blessed">
<meta property="og:title" content="Product — Humble &amp; Blessed">
<meta property="og:description" content="Humble &amp; Blessed pieces are made in small runs in New York, with the praying cherub on everything.">
<meta property="og:url" content="https://evaldez12.github.io/humble-and-blessed-site/b/product.html">
<meta property="og:image" content="https://evaldez12.github.io/humble-and-blessed-site/assets/share-card.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A white marble praying cherub in front of the Humble &amp; Blessed wordmark">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://evaldez12.github.io/humble-and-blessed-site/assets/share-card.jpg">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="https://evaldez12.github.io/humble-and-blessed-site/assets/logo-circle.png">
<!--/seo-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo-circle.png">
<link rel="stylesheet" href="style.css?v=20261021d">
</head>
<body data-page="shop">

<section class="wrap pdp" id="pdp"></section>

<section class="section"><div class="wrap">
  <div class="section-head"><h2>Also in drop one</h2><a href="shop.html">See everything</a></div>
  <div class="grid" id="more"></div>
</div></section>

<script src="../shared/products.js?v=20261021d"></script>
<script src="site.js?v=20261021d"></script>
<script>
(() => {
const { PRODUCTS, SIZES, addToCart, byId, cards, money } = Object.assign({}, window.HB_DATA, window.HB);
const id = new URLSearchParams(location.search).get('id') || 'shorts';
const p = byId(id) || PRODUCTS[0];
document.title = `${p.name} — Humble & Blessed`;
/* per-product search tags: canonical, description and Product data, built from shared/products.js */
(() => {
  const base = document.querySelector('link[rel=canonical]').href.replace(/product\.html.*$/, '');
  const url = `${base}product.html?id=${p.id}`, img = new URL(p.img, location.href).href;
  document.querySelector('link[rel=canonical]').href = url;
  document.querySelector('meta[name=description]').content = `${p.name}. ${p.blurb}`;
  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Product', name: p.name, description: p.blurb, image: img, color: p.color, category: p.cat,
    brand: { '@type': 'Brand', name: 'Humble & Blessed' },
    ...(p.soon ? {} : { offers: { '@type': 'Offer', url, price: p.price, priceCurrency: 'USD', availability: 'https://schema.org/InStock' } }) });
  document.head.appendChild(ld);
})();
const sizes = SIZES[p.id];
document.getElementById('pdp').innerHTML = `
  <div class="gallery"><img src="${p.img}" alt="${p.name}"></div>
  <div>
    <div class="label">${p.cat} · ${p.color}</div>
    <h1>${p.name}</h1>
    <div class="price${p.soon ? ' soon' : ''}">${p.soon ? 'Coming soon' : money(p.price)}</div>
    <p class="blurb">${p.blurb}</p>
    ${p.soon ? `<p class="soon-note">Not out yet. Drop dates go up first on Instagram, <a href="https://instagram.com/humblenblessed" target="_blank" rel="noopener">@humblenblessed</a>.</p>` : `
    <div class="label">Size</div>
    <div class="sizes">${sizes.map((s,i) => `<button class="${i===0?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
    <button class="btn wide solid" id="add">Add to cart</button>`}
    <div class="added" id="added"></div>
    <div style="margin-top:28px">
      <details open><summary>Details</summary><ul>${p.details.map(d => `<li>${d}</li>`).join('')}</ul></details>
      <details><summary>Fit</summary><ul><li>Runs true to size with a relaxed cut. Between sizes, take the smaller one.</li><li>Model is 5'11" and wears a medium.</li></ul></details>
      <details><summary>Shipping and returns</summary><ul><li>Ships from New York in two to four business days. Free in the US over $100.</li><li>Unworn pieces can be returned within 14 days. Final drops are not restocked.</li></ul></details>
    </div>
  </div>`;
let size = sizes[0];
document.querySelectorAll('.sizes button').forEach(b => b.onclick = () => { document.querySelectorAll('.sizes button').forEach(x => x.classList.remove('on')); b.classList.add('on'); size = b.dataset.s; });
if (!p.soon) document.getElementById('add').onclick = () => { addToCart(p.id, size); document.getElementById('added').textContent = `Added ${p.name}, ${size}.`; };
cards(document.getElementById('more'), PRODUCTS.filter(x => x.id !== p.id));
})();
</script>
</body>
</html>
