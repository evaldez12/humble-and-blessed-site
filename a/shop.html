<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Humble & Blessed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/logo-circle.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">

<section class="page-head"><div class="wrap">
  <h1>Drop one</h1>
  <p>Four pieces. Each one made once, in New York.</p>
</div></section>

<section class="wrap" style="padding-bottom:12vh">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<script src="../shared/products.js"></script>
<script src="site.js"></script>
<script>
(() => {
const { PRODUCTS, cards } = Object.assign({}, window.HB_DATA, window.HB);
const cats = ['All', ...new Set(PRODUCTS.map(p => p.cat))];
const f = document.getElementById('filters'), g = document.getElementById('grid');
let cur = decodeURIComponent(location.hash.slice(1)) || 'All';
function draw(){
  f.innerHTML = cats.map(c => `<button class="${c===cur?'on':''}" data-c="${c}">${c}</button>`).join('');
  f.querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.c; history.replaceState(null,'', cur==='All' ? ' ' : '#'+cur); draw(); });
  cards(g, cur === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cur));
}
draw();
})();
</script>
</body>
</html>
